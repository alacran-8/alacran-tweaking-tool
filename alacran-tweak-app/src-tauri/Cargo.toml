[package]
name = "alacran-tweak"
version = "2.0.0"
edition = "2021"
default-run = "AlacranTweak"

[lib]
name = "alacran_tweak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AlacranTweak"
path = "src/main.rs"
test = false

# Dev-only VM gate runner (docs/vm-testing.md); not shipped. Its exe carries the
# admin manifest, so it cannot run as an unelevated test binary.
[[bin]]
name = "vm_gate"
path = "src/bin/vm_gate.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
winreg = "0.56"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_TaskScheduler",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_SystemInformation",
    "Win32_System_Wmi",
    "Win32_System_Rpc",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "ApplicationModel",
    "Foundation_Collections",
    "Management_Deployment",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
